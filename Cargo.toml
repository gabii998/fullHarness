[package]
name = "ascurra-harness"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-18"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
pulldown-cmark = { version = "0.13", default-features = false }
tempfile = "3"
rfd = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "process"] }
futures-util = "0.3"
sha2 = "0.10"
base64 = "0.22"
jsonwebtoken = "9.3"
uuid = { version = "1", features = ["v4"] }
webbrowser = "1"
fs2 = "0.4"
time = { version = "0.3", features = ["parsing"] }
arboard = { version = "3.6", default-features = false }
portable-pty = "0.9"
vt100 = "0.16"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_JobObjects", "Win32_System_Threading"] }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# Windows software rendering must present cached pixels on native expose events.
[patch.crates-io]
i-slint-backend-winit = { path = "vendor/i-slint-backend-winit" }
